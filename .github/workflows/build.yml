name: Build plugin

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Package plugin folder
        run: |
          mkdir -p package_out/AchievementNotifier
          cp -r dist assets defaults main.py plugin.json package.json README.md package_out/AchievementNotifier/
          cd package_out && zip -r ../AchievementNotifier-built.zip AchievementNotifier

      - uses: actions/upload-artifact@v4
        with:
          name: AchievementNotifier-built
          path: AchievementNotifier-built.zip
